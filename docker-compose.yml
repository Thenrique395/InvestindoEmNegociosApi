services:
  postgres:
    image: postgres:16-alpine
    # Sobe de volta sozinho após crash/OOM ou reboot do host, para não deixar a
    # esteira travada (o apply-schema depende do banco estar de pé).
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-bootstrap:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DB_SCHEMA_PATH:-./InvestindoEmNegocio/Infrastructure/Data/schema.sql}:/schema/schema.sql:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        until pg_isready -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 1
        done
        if psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'users'" | grep -q 1; then
          echo "Schema already initialized. Skipping bootstrap."
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 -1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /schema/schema.sql

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thenrique395/investindoemnegociosapi:latest}
    ports:
      - "${API_PORT:-5059}:5059"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:5059
      ConnectionStrings__Default: ${DB_CONN}
      Jwt__Issuer: InvestindoEmNegocio
      Jwt__Audience: InvestindoEmNegocio
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      OTEL_SERVICE_NAME: InvestindoEmNegocio
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      MarketData__Provider: free
      MarketData__BrapiToken: ${BRAPI_TOKEN}
      PasswordReset__FrontendResetUrl: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:4200/reset-password}
      PasswordReset__TokenExpiryMinutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-30}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Investindo em Negocios}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__FrontendBaseUrl: ${STRIPE_FRONTEND_BASE_URL:-http://localhost:4200}
      Stripe__PaymentMethodTypes: ${STRIPE_PAYMENT_METHOD_TYPES:-card}
      Database__ApplySchemaOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5059/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
