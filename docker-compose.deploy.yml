services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thenrique395/investindoemnegociosapi:latest}
    ports:
      - "${API_PORT:-5055}:5059"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:5059
      ConnectionStrings__Default: ${DB_CONN}
      Jwt__Issuer: InvestindoEmNegocio
      Jwt__Audience: InvestindoEmNegocio
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      OTEL_SERVICE_NAME: InvestindoEmNegocio
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      MarketData__Provider: free
      MarketData__BrapiToken: ${BRAPI_TOKEN}
      PasswordReset__FrontendResetUrl: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:4200/reset-password}
      PasswordReset__TokenExpiryMinutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-30}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Investindo em Negocios}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__FrontendBaseUrl: ${STRIPE_FRONTEND_BASE_URL:-http://localhost:4200}
      Stripe__PaymentMethodTypes: ${STRIPE_PAYMENT_METHOD_TYPES:-card}
      Database__ApplySchemaOnStartup: "false"
      # Persiste as chaves de DataProtection no volume abaixo (sobrevivem a deploy).
      DataProtection__KeysPath: /keys
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Auth__RequireSecureCookie: ${AUTH_REQUIRE_SECURE_COOKIE:-false}
      # Os origins do frontend no VPS ficam SEMPRE na lista (o loopback já é liberado
      # automaticamente pelo backend). A variável CORS_ALLOWED_ORIGINS pode adicionar mais.
      Cors__AllowedOrigins: http://35.174.50.187:4201,http://35.174.50.187:4200,${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      - alloy
    volumes:
      # Chaves de DataProtection persistidas fora do container (sobrevivem a deploy).
      - dataprotection-keys:/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5059/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Coletor leve (Grafana Alloy): recebe OTLP do backend e ENCAMINHA para o Grafana Cloud
  # (observabilidade off-VPS), além de coletar métricas de host (CPU/RAM/disco). Substitui o
  # antigo grafana/otel-lgtm — muito mais leve, tira carga do VPS. Sem portas publicadas (só a
  # rede interna do Compose). Credenciais vêm de env (GitHub secrets), nunca do repositório.
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
      # DSN do Postgres p/ o exporter (key-value; senha vem do secret via env, não do repo).
      POSTGRES_DSN: "host=35.174.50.187 port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

volumes:
  dataprotection-keys:

