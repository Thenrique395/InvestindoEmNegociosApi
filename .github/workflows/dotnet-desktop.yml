name: Deploy Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/thenrique395/investindoemnegociosapi:latest

      - name: Upload compose + schema to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env,InvestindoEmNegocio/Infrastructure/Data/schema.full.sql"
          target: "/home/ubuntu/InvestindoEmNegocio"

      - name: Deploy backend + postgres on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /home/ubuntu/InvestindoEmNegocio
            cd /home/ubuntu/InvestindoEmNegocio
            # ensure schema is in place for initdb
            mv -f /home/ubuntu/InvestindoEmNegocio/InvestindoEmNegocio/Infrastructure/Data/schema.full.sql /home/ubuntu/InvestindoEmNegocio/schema.full.sql || true
            docker login ghcr.io -u ${{ secrets.GHCR_USER }} -p ${{ secrets.GHCR_TOKEN }}
            docker compose pull
            docker compose up -d --no-build
