name: Deliver Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: backend-delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/thenrique395/investindoemnegociosapi
  DEPLOY_PATH: /home/ubuntu/InvestindoEmNegocio

jobs:
  test:
    name: Test And Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run unit tests with coverage
        run: |
          dotnet test InvestindoEmNegocio.Tests/InvestindoEmNegocio.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Enforce minimum coverage thresholds
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          threshold_overall = 0.45
          threshold_services = 0.55

          coverage_file = None
          for root, _, files in os.walk("TestResults"):
            for f in files:
              if f == "coverage.cobertura.xml":
                coverage_file = os.path.join(root, f)
                break
            if coverage_file:
              break

          if not coverage_file:
            raise SystemExit("coverage.cobertura.xml not found in TestResults")

          tree = ET.parse(coverage_file)
          root = tree.getroot()

          overall = float(root.attrib.get("line-rate", 0))

          total_lines = 0
          covered_lines = 0
          for cls in root.findall(".//class"):
            filename = cls.attrib.get("filename", "")
            if "Application/Services/" not in filename and "Application\\Services\\" not in filename:
              continue
            for line in cls.findall("./lines/line"):
              total_lines += 1
              if int(line.attrib.get("hits", "0")) > 0:
                covered_lines += 1

          services = (covered_lines / total_lines) if total_lines else 0.0

          print(f"Overall line coverage: {overall:.2%}")
          print(f"Application/Services line coverage: {services:.2%}")

          if overall < threshold_overall:
            raise SystemExit(f"Overall coverage below threshold: {overall:.2%} < {threshold_overall:.2%}")
          if services < threshold_services:
            raise SystemExit(f"Services coverage below threshold: {services:.2%} < {threshold_services:.2%}")
          PY

  build-and-push:
    name: Build And Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.IMAGE_NAME }}:main

  deploy-dev:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O schema é aplicado pelo próprio app no boot (EF Migrations) — não há mais passo
      # de schema.sql aqui nem cliente psql. Ver DbMigrationExtensions.ApplyDatabaseSchemaAsync.

      - name: Upload deployment compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.deploy.yml,docker-compose.yml,alloy/config.alloy"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy stack to development
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_NAME: invest-dev
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          DB_CONN: ${{ secrets.DB_CONN }}
          ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          PASSWORD_RESET_FRONTEND_URL: ${{ vars.PASSWORD_RESET_FRONTEND_URL }}
          PASSWORD_RESET_TOKEN_EXPIRY_MINUTES: ${{ vars.PASSWORD_RESET_TOKEN_EXPIRY_MINUTES }}
          EMAIL_CONFIRMATION_FRONTEND_URL: ${{ vars.EMAIL_CONFIRMATION_FRONTEND_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_ENABLE_SSL: ${{ vars.SMTP_ENABLE_SSL }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_FRONTEND_BASE_URL: ${{ vars.STRIPE_FRONTEND_BASE_URL }}
          STRIPE_PAYMENT_METHOD_TYPES: ${{ vars.STRIPE_PAYMENT_METHOD_TYPES }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ vars.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ vars.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: STACK_NAME,BACKEND_IMAGE,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_PORT,API_PORT,DB_CONN,ASPNETCORE_ENVIRONMENT,JWT_SECRET_KEY,BRAPI_TOKEN,PASSWORD_RESET_FRONTEND_URL,PASSWORD_RESET_TOKEN_EXPIRY_MINUTES,EMAIL_CONFIRMATION_FRONTEND_URL,SMTP_HOST,SMTP_PORT,SMTP_ENABLE_SSL,SMTP_USER,SMTP_PASS,SMTP_FROM_EMAIL,SMTP_FROM_NAME,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PUBLISHABLE_KEY,STRIPE_FRONTEND_BASE_URL,STRIPE_PAYMENT_METHOD_TYPES,CORS_ALLOWED_ORIGINS,GRAFANA_CLOUD_OTLP_ENDPOINT,GRAFANA_CLOUD_INSTANCE_ID,GRAFANA_CLOUD_API_TOKEN,POSTGRES_DSN,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail

            wait_for_service_health() {
              local service_name="$1"
              local container_id=""
              local status=""

              container_id="$(docker compose -p "$STACK_NAME" ps -q "$service_name")"
              if [ -z "$container_id" ]; then
                echo "Container for service '$service_name' not found."
                docker compose -p "$STACK_NAME" ps
                return 1
              fi

              for _ in $(seq 1 30); do
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
                if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                  return 0
                fi
                sleep 2
              done

              echo "Service '$service_name' did not become healthy. Current status: $status"
              docker compose -p "$STACK_NAME" ps
              docker compose -p "$STACK_NAME" logs --tail=100 "$service_name"
              return 1
            }

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml down --remove-orphans || true
            occupied_containers="$(docker ps --filter "publish=$API_PORT" --format '{{.ID}}' | tr '\n' ' ')"
            if [ -n "$occupied_containers" ]; then
              echo "Stopping containers occupying port $API_PORT: $occupied_containers"
              docker stop $occupied_containers || true
              docker rm -f $occupied_containers || true
            fi
            # Stack está parado aqui: libera disco removendo imagens/cache não usados
            # ANTES do pull (evita "no space left on device" e pull travado). Não usa
            # --volumes, então o volume do Postgres (dados/usuários) é preservado.
            docker image prune -af || true
            docker builder prune -af || true
            df -h / || true
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml config >/dev/null
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml pull
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml up -d --remove-orphans
            wait_for_service_health backend
