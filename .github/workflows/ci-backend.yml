name: CI Backend

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore InvestindoEmNegocio.sln

      - name: Smoke suite
        run: dotnet test InvestindoEmNegocio.Tests/InvestindoEmNegocio.Tests.csproj --configuration Release --filter "Suite=Smoke"

  unit-and-integration:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Backend quality gate
        run: bash ./scripts/quality-backend.sh
