name: Deploy Backend Production

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Imagem GHCR para publicar em PRD. Vazio usa o SHA selecionado no workflow."
        required: false
        type: string
      confirm:
        description: 'Ambiente PRD pausado temporariamente (ver docs/DECISIONS/2026-06-15-pausar-ambiente-prd-focar-dev.md). Digite "DEPLOY" para liberar este deploy.'
        required: true
        type: string

concurrency:
  group: backend-production-delivery
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/thenrique395/investindoemnegociosapi
  DEPLOY_PATH: /home/ubuntu/InvestindoEmNegocio

jobs:
  resolve-image:
    name: Resolve Production Image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Resolve image ref
        id: image
        env:
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_REF:-}" ]; then
            echo "image_ref=${INPUT_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  deploy-prd:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: resolve-image
    environment: production
    # Ambiente PRD pausado temporariamente — ver docs/DECISIONS/2026-06-15-pausar-ambiente-prd-focar-dev.md.
    # Exige digitar "DEPLOY" no input `confirm` para liberar este job.
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply production database schema
        env:
          DB_CONN: ${{ secrets.DB_CONN }}
        run: ./scripts/apply-schema-from-db-conn.sh

      - name: Upload deployment compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.deploy.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy stack to production
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_NAME: invest-prd
          BACKEND_IMAGE: ${{ needs.resolve-image.outputs.image_ref }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          DB_CONN: ${{ secrets.DB_CONN }}
          ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          PASSWORD_RESET_FRONTEND_URL: ${{ vars.PASSWORD_RESET_FRONTEND_URL }}
          PASSWORD_RESET_TOKEN_EXPIRY_MINUTES: ${{ vars.PASSWORD_RESET_TOKEN_EXPIRY_MINUTES }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_ENABLE_SSL: ${{ vars.SMTP_ENABLE_SSL }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_FRONTEND_BASE_URL: ${{ vars.STRIPE_FRONTEND_BASE_URL }}
          STRIPE_PAYMENT_METHOD_TYPES: ${{ vars.STRIPE_PAYMENT_METHOD_TYPES }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STACK_NAME,BACKEND_IMAGE,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_PORT,API_PORT,DB_CONN,ASPNETCORE_ENVIRONMENT,JWT_SECRET_KEY,BRAPI_TOKEN,PASSWORD_RESET_FRONTEND_URL,PASSWORD_RESET_TOKEN_EXPIRY_MINUTES,SMTP_HOST,SMTP_PORT,SMTP_ENABLE_SSL,SMTP_USER,SMTP_PASS,SMTP_FROM_EMAIL,SMTP_FROM_NAME,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PUBLISHABLE_KEY,STRIPE_FRONTEND_BASE_URL,STRIPE_PAYMENT_METHOD_TYPES,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail

            wait_for_service_health() {
              local service_name="$1"
              local container_id=""
              local status=""

              container_id="$(docker compose -p "$STACK_NAME" ps -q "$service_name")"
              if [ -z "$container_id" ]; then
                echo "Container for service '$service_name' not found."
                docker compose -p "$STACK_NAME" ps
                return 1
              fi

              for _ in $(seq 1 30); do
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
                if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                  return 0
                fi
                sleep 2
              done

              echo "Service '$service_name' did not become healthy. Current status: $status"
              docker compose -p "$STACK_NAME" ps
              docker compose -p "$STACK_NAME" logs --tail=100 "$service_name"
              return 1
            }

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml down --remove-orphans || true
            occupied_containers="$(docker ps --filter "publish=$API_PORT" --format '{{.ID}}' | tr '\n' ' ')"
            if [ -n "$occupied_containers" ]; then
              echo "Stopping containers occupying port $API_PORT: $occupied_containers"
              docker stop $occupied_containers || true
              docker rm -f $occupied_containers || true
            fi
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml config >/dev/null
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml pull
            docker compose -p "$STACK_NAME" -f docker-compose.deploy.yml up -d --remove-orphans
            wait_for_service_health backend
