# Stack de PRODUÇÃO (VPS dedicada). Diferente do DEV: Postgres roda AQUI dentro, na rede
# interna do Compose, SEM porta pública (o backend conecta via nome de serviço "postgres").
# Deploy é MANUAL (workflow_dispatch "Deploy Production"). Migrations aplicam no boot.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investindo_prd}
      POSTGRES_USER: ${POSTGRES_USER:-investindo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_prd:/var/lib/postgresql/data
    # Sem `ports:` — Postgres fica só na rede interna do Compose (não exposto na internet).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thenrique395/investindoemnegociosapi:main}
    restart: unless-stopped
    ports:
      - "${API_PORT:-5055}:5059"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5059
      # Conecta no Postgres pela rede interna (Host=postgres). Pool limitado a 85 (lição do DEV).
      ConnectionStrings__Default: ${DB_CONN}
      # App aplica as EF Migrations no boot (fonte única do schema).
      Database__ApplySchemaOnStartup: "true"
      Jwt__Issuer: InvestindoEmNegocio
      Jwt__Audience: InvestindoEmNegocio
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      OTEL_SERVICE_NAME: InvestindoEmNegocio
      # Observabilidade adicionada em follow-up (precisa do token de push do Grafana Cloud).
      # Por ora exporters desligados — o backend sobe normalmente sem coletor.
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      MarketData__Provider: free
      MarketData__BrapiToken: ${BRAPI_TOKEN}
      PasswordReset__FrontendResetUrl: ${PASSWORD_RESET_FRONTEND_URL:-http://44.222.213.37/reset-password}
      PasswordReset__TokenExpiryMinutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-30}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Investindo em Negocios}
      DataProtection__KeysPath: /keys
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      # PRD ainda em HTTP (sem domínio/TLS) — cookie seguro desligado por ora.
      Auth__RequireSecureCookie: ${AUTH_REQUIRE_SECURE_COOKIE:-false}
      # Origem do frontend de PRD (porta 80) sempre liberada; CORS_ALLOWED_ORIGINS adiciona mais.
      Cors__AllowedOrigins: http://44.222.213.37,http://44.222.213.37:80,${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dataprotection_keys_prd:/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5059/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 15

  # OBSERVABILIDADE (Alloy → Grafana Cloud) entra em follow-up, quando o token de push do
  # Grafana Cloud for provisionado como secret. O backend acima já roda sem coletor.

volumes:
  pg_data_prd:
  dataprotection_keys_prd:
