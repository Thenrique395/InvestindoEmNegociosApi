# Stack de PRODUÇÃO completa (VPS dedicada). Único ponto público: Caddy na porta 80.
# Postgres e backend ficam SÓ na rede interna do Compose (não expostos na internet).
# Deploy é MANUAL (workflow_dispatch "Deploy Production"). Migrations aplicam no boot.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investindo_prd}
      POSTGRES_USER: ${POSTGRES_USER:-investindo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_prd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thenrique395/investindoemnegociosapi:main}
    restart: unless-stopped
    # Sem porta pública — só a rede interna (Caddy faz o proxy de /api).
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5059
      ConnectionStrings__Default: ${DB_CONN}
      Database__ApplySchemaOnStartup: "true"
      Jwt__Issuer: InvestindoEmNegocio
      Jwt__Audience: InvestindoEmNegocio
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      OTEL_SERVICE_NAME: InvestindoEmNegocio
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
      MarketData__Provider: free
      MarketData__BrapiToken: ${BRAPI_TOKEN}
      PasswordReset__FrontendResetUrl: ${PASSWORD_RESET_FRONTEND_URL:-http://44.222.213.37/reset-password}
      PasswordReset__TokenExpiryMinutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:-30}
      EmailConfirmation__FrontendConfirmUrl: ${EMAIL_CONFIRMATION_FRONTEND_URL:-http://44.222.213.37/login}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Investindo em Negócios}
      DataProtection__KeysPath: /keys
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      # Mesmo origin do frontend (via Caddy na 80) — cookie seguro off enquanto for HTTP.
      Auth__RequireSecureCookie: ${AUTH_REQUIRE_SECURE_COOKIE:-false}
      Cors__AllowedOrigins: http://44.222.213.37,${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    volumes:
      - dataprotection_keys_prd:/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5059/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 15

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/thenrique395/investindoemnegociosweb:main}
    restart: unless-stopped
    # SSR (Node) na porta 4000, só rede interna (Caddy serve na 80).
    environment:
      PORT: "4000"
      NODE_ENV: production
      # URL pública da API (via Caddy, mesmo host:80). Usada tanto no SSR quanto no browser.
      API_BASE_URL: ${API_BASE_URL:-http://44.222.213.37/api/v1}
      ANGULAR_ALLOWED_HOSTS: ${ANGULAR_ALLOWED_HOSTS:-44.222.213.37,localhost}
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
      # Exporter do Postgres aponta pro serviço interno "postgres".
      POSTGRES_DSN: ${POSTGRES_DSN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prd:/data
      - caddy_config_prd:/config
    depends_on:
      - backend
      - frontend

volumes:
  pg_data_prd:
  dataprotection_keys_prd:
  caddy_data_prd:
  caddy_config_prd:
